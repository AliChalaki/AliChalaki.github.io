<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>آکادمی پایتون‌تاپ | ساخت آینده با هوش مصنوعی</title>

  <!-- فونت وزیرمتن باکیفیت برای تمامی دستگاه‌ها -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & Babel Standalone -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --font-main: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      background-color: #1a1c1e;
      color: #f3f4f6;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .animate-blink {
      animation: blink 0.9s step-end infinite;
    }

    .hero-text-shadow {
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0, 0, 0, 0.95);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    .animate-modal {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatBox {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    .animate-float-1 {
      animation: floatBox 3.2s ease-in-out infinite;
    }
    .animate-float-2 {
      animation: floatBox 3.8s ease-in-out 0.3s infinite;
    }
    .animate-float-3 {
      animation: floatBox 3.5s ease-in-out 0.6s infinite;
    }
  </style>
</head>
<body class="select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function useTypewriter(text, speed = 36, startDelay = 450) {
      const [displayed, setDisplayed] = useState("");
      const [done, setDone] = useState(false);

      useEffect(() => {
        let timeoutId;
        let intervalId;
        let currentIndex = 0;

        timeoutId = setTimeout(() => {
          intervalId = setInterval(() => {
            if (currentIndex < text.length) {
              setDisplayed(text.slice(0, currentIndex + 1));
              currentIndex++;
            } else {
              setDone(true);
              clearInterval(intervalId);
            }
          }, speed);
        }, startDelay);

        return () => {
          clearTimeout(timeoutId);
          clearInterval(intervalId);
        };
      }, [text, speed, startDelay]);

      return { displayed, done };
    }

    function App() {
      const [menuOpen, setMenuOpen] = useState(false);
      const [buttonsVisible, setButtonsVisible] = useState(false);
      const [supportModalOpen, setSupportModalOpen] = useState(false);
      const [channelModalOpen, setChannelModalOpen] = useState(false);
      const [copiedSupportTg, setCopiedSupportTg] = useState(false);
      const [copiedSupportIran, setCopiedSupportIran] = useState(false);
      const [copiedChannel, setCopiedChannel] = useState(false);

      const videoRef = useRef(null);
      const targetTimeRef = useRef(0);
      const isSeekingRef = useRef(false);

      const typewriterText = "دیگه لازم نیست سال‌ها کد بنویسی تا ایده‌هات زنده بشن؛ امروز فقط اراده کن، هوش مصنوعی برات خلقش می‌کنه. آماده‌ای بازی خودت رو بسازی؟";
      const { displayed, done } = useTypewriter(typewriterText, 35, 450);

      useEffect(() => {
        const timer = setTimeout(() => {
          setButtonsVisible(true);
        }, 350);
        return () => clearTimeout(timer);
      }, []);

      // موتور هوشمند چرخش ویدیو: نرم، بی‌صدا و بدون لگ روی موبایل
      useEffect(() => {
        const video = videoRef.current;
        if (!video) return;

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        if (isTouchDevice) {
          video.loop = true;
          video.playbackRate = 0.85;
          video.play().catch(() => {});
          return;
        }

        let animationFrameId;

        const renderLoop = () => {
          if (video && video.duration && !isSeekingRef.current) {
            const current = video.currentTime;
            const target = targetTimeRef.current;
            const diff = target - current;

            if (Math.abs(diff) > 0.04) {
              isSeekingRef.current = true;
              video.currentTime = current + diff * 0.08;
            }
          }
          animationFrameId = requestAnimationFrame(renderLoop);
        };

        animationFrameId = requestAnimationFrame(renderLoop);

        const handleMouseMove = (e) => {
          if (!video || !video.duration) return;
          const ratio = 1 - (e.clientX / window.innerWidth);
          targetTimeRef.current = Math.min(Math.max(ratio * video.duration, 0.05), video.duration - 0.05);
        };

        window.addEventListener("mousemove", handleMouseMove, { passive: true });

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener("mousemove", handleMouseMove);
        };
      }, []);

      const handleSeeked = () => {
        isSeekingRef.current = false;
      };

      const scrollToCourse = () => {
        const el = document.getElementById("course-details");
        if (el) el.scrollIntoView({ behavior: "smooth" });
      };

      const copySupportTgId = () => {
        navigator.clipboard.writeText("@PythonTop0");
        setCopiedSupportTg(true);
        setTimeout(() => setCopiedSupportTg(false), 2000);
      };

      const copySupportIranId = () => {
        navigator.clipboard.writeText("@PythonTop");
        setCopiedSupportIran(true);
        setTimeout(() => setCopiedSupportIran(false), 2000);
      };

      const copyChannelId = () => {
        navigator.clipboard.writeText("@PythonTopacademy");
        setCopiedChannel(true);
        setTimeout(() => setCopiedChannel(false), 2000);
      };

      // فهرست روان و شفاف سرفصل‌های داکس
      const syllabusList = [
        {
          num: "فصل ۱",
          title: "ورود به دنیای بدون کد و جعبه‌ابزار ابری",
          desc: "شکستن سد ترس از برنامه‌نویسی، نقشه راه ۲۱ درس و آماده‌سازی رایگان Google AI Studio بدون نیاز به نصب حتی یک مگابایت نرم‌افزار سنگین روی سیستم."
        },
        {
          num: "فصل ۲",
          title: "کالبدشکافی ارگونومی اپلیکیشن و منطقه شست",
          desc: "رازهای UI/UX موبایلی (Thumb Zone)، دکمه‌های لمسی ۴۸ پیکسلی، سیستم ناوبری Bottom Nav و Drawer، لودینگ اسکلتون و طراحی امن Safe Area برای آیفون و سامسونگ."
        },
        {
          num: "فصل ۳",
          title: "فرمول طلایی پرامپت‌نویسی ۵ بخشی",
          desc: "چطور هوش مصنوعی رو مثل یک برنامه‌نویس ارشد سیلیکون‌ولی هدایت کنیم تا کدهای ناقص ندهد؟ صدور دستورات معماری، ظاهر شیشه‌ای مدرن و استایل‌های ریسپانسیو."
        },
        {
          num: "فصل ۴",
          title: "کارگاه ساخت عملی اپلیکیشن + هوش مصنوعی گوگل",
          desc: "ساخت گام‌به‌گام داشبورد لمسی، ذخیره دائمی دیتا در حافظه گوشی (LocalStorage)، سیستم اعتیادآور گیمیفیکیشن (استریک و XP) و اتصال مستقیم به مغز Gemini API."
        },
        {
          num: "فصل ۵",
          title: "تکنیک شکار باگ و دیباگ معکوس در ۱۰ ثانیه",
          desc: "مهار صفحه سفید، عیب‌یابی سریع خطاهای کنسول با ارسال لاگ به AI، رفع به هم ریختگی‌های ظاهری در گوشی‌های مختلف و کنترل خطاهای فراموشی هوش مصنوعی."
        },
        {
          num: "فصل ۶",
          title: "خروجی واقعی نصبی اندروید (APK) و PWA",
          desc: "تبدیل پروژه وب به وب‌اپلیکیشن نصب‌شونده (PWA)، ساخت فایل شناسنامه Manifest، تولید فایل نصبی رسمی اندروید با ابزار ابری مایکروسافت و آماده‌سازی آیکون ۳بعدی."
        },
        {
          num: "فصل ۷",
          title: "۴ استراتژی پول‌ساز کسب درآمد دلاری و پروژه‌ای",
          desc: "چگونه این مهارت را به درآمد تبدیل کنیم؟ قراردادهای ۱۰ تا ۳۰ میلیونی با مشاغل محلی، درآمد غیرفعال از تبلیغات کافه‌بازار/مایکت و فروش اشتراک خدمات هوش مصنوعی."
        }
      ];

      return (
        <div className="relative w-full">
          {/* ویدیو پس‌زمینه با فلیپ افقی */}
          <video
            ref={videoRef}
            src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260530_042513_df96a13b-6155-4f6e-8b93-c9dee66fba08.mp4"
            className="fixed inset-0 z-0 h-screen w-screen object-cover pointer-events-none transform -scale-x-100"
            style={{ objectPosition: "75% center" }}
            muted
            playsInline
            preload="auto"
            onSeeked={handleSeeked}
          />

          {/* گرادیانت تیره در سمت راست برای خوانایی متون */}
          <div className="fixed inset-0 z-[1] bg-gradient-to-l from-black/85 via-black/45 to-transparent pointer-events-none" />

          {/* ===================== نوبار ===================== */}
          <header className="fixed top-0 left-0 right-0 z-20 flex w-full items-center justify-between px-4 sm:px-8 md:px-12 py-4 sm:py-5">
            <div className="flex items-center gap-2 sm:gap-3">
              <span className="text-lg sm:text-2xl font-black tracking-tight text-white hero-text-shadow">
                پایتون‌تاپ <span className="text-xs sm:text-sm font-normal text-amber-400">| AI Studio</span>
              </span>
              <span className="text-xl sm:text-2xl text-amber-400 select-none animate-pulse">✳︎</span>
            </div>

            <nav className="hidden lg:flex items-center text-sm xl:text-base text-white/90 font-medium gap-2">
              <a 
                href="https://alichalaki.github.io/ai-academy.html"
                className="px-3.5 py-1.5 rounded-full bg-amber-400/10 text-amber-300 border border-amber-400/30 hover:bg-amber-400 hover:text-black transition-all flex items-center gap-1.5 text-xs xl:text-sm font-semibold ml-2"
              >
                <span>بازگشت به آکادمی AI</span>
                <span className="text-sm">→</span>
              </a>

              <button onClick={scrollToCourse} className="hover:text-amber-400 transition-colors">
                معرفی دوره
              </button>
              <span className="opacity-40">،</span>
              <a href="#syllabus" className="hover:text-amber-400 transition-colors">
                سرفصل‌های ۲۱ درس
              </a>
              <span className="opacity-40">،</span>
              <a 
                href="https://alichalaki.github.io/" 
                target="_blank" 
                rel="noopener"
                className="hover:text-amber-400 transition-colors"
              >
                رزومه مدرس (علی چالاکی)
              </a>
              <span className="opacity-40">،</span>
              <button onClick={() => setChannelModalOpen(true)} className="hover:text-amber-400 transition-colors">
                کانال رسمی آکادمی
              </button>
              <span className="opacity-40">،</span>
              <button onClick={() => setSupportModalOpen(true)} className="hover:text-amber-400 transition-colors">
                پشتیبانی و مشاوره
              </button>
            </nav>

            <div className="hidden sm:block">
              <a
                href="#pricing"
                className="px-5 py-2 rounded-full bg-white/10 hover:bg-white text-white hover:text-black border border-white/20 transition-all duration-300 backdrop-blur-md text-xs sm:text-sm font-semibold shadow-lg"
              >
                ثبت‌نام با تخفیف ویژه
              </a>
            </div>

            <button
              onClick={() => setMenuOpen(!menuOpen)}
              className="lg:hidden flex flex-col justify-center items-center w-8 h-8 gap-[5px] z-30 focus:outline-none"
              aria-label="Toggle Menu"
            >
              <span className={`w-6 h-[2px] bg-white transition-all duration-300 transform ${menuOpen ? "rotate-45 translate-y-[7px]" : ""}`} />
              <span className={`w-6 h-[2px] bg-white transition-all duration-300 ${menuOpen ? "opacity-0" : "opacity-100"}`} />
              <span className={`w-6 h-[2px] bg-white transition-all duration-300 transform ${menuOpen ? "-rotate-45 -translate-y-[7px]" : ""}`} />
            </button>
          </header>

          {/* منوی موبایل */}
          <div
            className={`fixed inset-0 z-20 bg-[#1a1c1e]/98 backdrop-blur-2xl flex flex-col justify-center px-8 gap-5 transition-all duration-300 lg:hidden ${
              menuOpen ? "opacity-100 pointer-events-auto" : "opacity-0 pointer-events-none"
            }`}
          >
            <a 
              href="https://alichalaki.github.io/ai-academy.html"
              onClick={() => setMenuOpen(false)}
              className="py-2.5 px-4 rounded-xl bg-amber-400/15 border border-amber-400/30 text-amber-300 font-bold text-base flex items-center justify-between"
            >
              <span>بازگشت به آکادمی هوش مصنوعی</span>
              <span>→</span>
            </a>

            <button onClick={() => { scrollToCourse(); setMenuOpen(false); }} className="text-xl sm:text-2xl font-bold text-right text-white hover:text-amber-400">
              درباره دوره جدید
            </button>
            <a href="#syllabus" onClick={() => setMenuOpen(false)} className="text-xl sm:text-2xl font-bold text-white hover:text-amber-400">
              سرفصل‌های جامع ۲۱ درس
            </a>
            <a 
              href="https://alichalaki.github.io/" 
              target="_blank" 
              rel="noopener"
              onClick={() => setMenuOpen(false)} 
              className="text-xl sm:text-2xl font-bold text-white hover:text-amber-400 flex items-center gap-2"
            >
              <span>👨‍🏫</span>
              <span>رزومه مدرس (علی چالاکی)</span>
            </a>
            <a href="#pricing" onClick={() => setMenuOpen(false)} className="text-xl sm:text-2xl font-bold text-white hover:text-amber-400">
              شهریه و تخفیف ۹۸۰ تومانی
            </a>
            <a
              href="tel:09102655884"
              target="_self"
              onClick={() => setMenuOpen(false)}
              className="text-lg font-bold text-amber-400 text-right flex items-center gap-2"
            >
              <span>📞</span>
              <span>شماره‌گیری فوری: 09102655884</span>
            </a>
            <div className="flex flex-col gap-3 pt-2">
              <button
                onClick={() => { setMenuOpen(false); setChannelModalOpen(true); }}
                className="py-3 bg-amber-400 text-black font-bold text-center rounded-xl flex items-center justify-center gap-2 shadow-lg"
              >
                <span>📢</span>
                <span>کانال رسمی آکادمی (@PythonTopacademy)</span>
              </button>
              <button
                onClick={() => { setMenuOpen(false); setSupportModalOpen(true); }}
                className="py-3 bg-white/10 border border-white/20 text-white font-bold text-center rounded-xl flex items-center justify-center gap-2"
              >
                <span>💬</span>
                <span>پشتیبانی و مشاوره</span>
              </button>
            </div>
          </div>

          {/* ===================== بخش هیرو ===================== */}
          <section className="relative z-10 h-screen w-full flex flex-col justify-center px-5 sm:px-10 md:px-16 lg:px-20 overflow-hidden">
            <div className="w-full max-w-xl relative z-10 text-right mr-0 ml-auto">
              
              <div
                className="pointer-events-none select-none mb-3 sm:mb-4 text-white/80 font-light"
                style={{
                  fontSize: "clamp(14px, 3.2vw, 20px)",
                  lineHeight: "1.5",
                  filter: "blur(2px)",
                }}
              >
                خوش اومدی به نسل جدید خلق کردن؛<br />
                جایی که هوش مصنوعی دست‌های توئه...
              </div>

              <p
                className="text-white font-medium mb-6 hero-text-shadow"
                style={{
                  fontSize: "clamp(16px, 4vw, 24px)",
                  lineHeight: "1.7",
                  minHeight: "75px",
                }}
              >
                {displayed}
                {!done && (
                  <span className="inline-block w-[3px] h-[1.1em] bg-amber-400 align-middle mr-1.5 animate-blink" />
                )}
              </p>

              <div
                className="flex flex-wrap gap-2.5 sm:gap-3 transition-all duration-500 ease-out"
                style={{
                  opacity: buttonsVisible ? 1 : 0,
                  transform: buttonsVisible ? "translateY(0)" : "translateY(12px)",
                }}
              >
                <button
                  onClick={scrollToCourse}
                  className="inline-flex items-center justify-center bg-white text-black font-bold text-xs sm:text-base px-5 sm:px-6 py-2.5 sm:py-3 rounded-full hover:bg-amber-400 transition-all duration-300 shadow-xl hover:scale-105"
                >
                  🚀 ورود به دنیای بدون کدنویسی
                </button>

                <a
                  href="#pricing"
                  className="inline-flex items-center justify-center bg-black/40 text-white border border-white/20 font-medium text-xs sm:text-base px-5 sm:px-6 py-2.5 sm:py-3 rounded-full hover:bg-white hover:text-black transition-all duration-300 backdrop-blur-md shadow-xl"
                >
                  🔥 رزرو تخفیف ویژه (فقط ۱۰ نفر)
                </a>
              </div>

            </div>
          </section>

          {/* محوکننده ترنزیشن */}
          <div className="relative z-10 w-full h-36 bg-gradient-to-b from-transparent via-[#1a1c1e]/85 to-[#1a1c1e] pointer-events-none -mt-36" />

          {/* ===================== بخش توضیحات دوره ===================== */}
          <section id="course-details" className="relative z-10 bg-[#1a1c1e] text-white py-14 sm:py-20 px-4 sm:px-10 md:px-16 lg:px-20 text-right">
            <div className="max-w-5xl mx-auto">
              
              <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/5 border border-white/10 text-amber-300 text-xs sm:text-sm backdrop-blur-md">
                  <span>⚡ دوره اختصاصی آکادمی پایتون‌تاپ</span>
                </div>

                <a
                  href="https://alichalaki.github.io/ai-academy.html"
                  className="inline-flex items-center gap-1.5 text-xs sm:text-sm text-neutral-400 hover:text-amber-300 transition-colors"
                >
                  <span>بازگشت به منوی دوره‌های AI</span>
                  <span>←</span>
                </a>
              </div>

              {/* عنوان اصلی دوره */}
              <div className="mb-8">
                <h2 className="text-2xl sm:text-4xl md:text-5xl font-black tracking-tight leading-[1.4] sm:leading-[1.35] text-white">
                  بدون یک خط کدنویسی و با هوش مصنوعی،
                  <span className="block mt-2 sm:mt-3 bg-gradient-to-l from-amber-300 via-amber-400 to-yellow-500 bg-clip-text text-transparent">
                    اپ و بازی خودتو بساز، انتشارش بده و درآمد کسب کن!
                  </span>
                </h2>
              </div>

              <p className="text-sm sm:text-lg md:text-xl text-neutral-300 leading-relaxed mb-10 max-w-3xl font-light">
                فکر می‌کنی برای ساخت اپلیکیشن و بازی موبایل حتماً باید برنامه‌نویسی بلد باشی یا سیستم قدرتمندی داشته باشی؟ وقتشه جور دیگه‌ای فکر کنی! توی این دوره یاد می‌گیری چطور با کمک هوش مصنوعی، ایده‌هات رو به اپلیکیشن‌ها و بازی‌های پولساز تبدیل کنی؛ حتی اگر از صفر شروع کنی! 🔥
              </p>

              {/* ۳ باکس مجزا با انیمیشن ملایم تکان خوردن */}
              <div className="mb-12 flex flex-wrap items-center justify-center gap-3 sm:gap-4">
                <div className="animate-float-1 px-5 py-3 rounded-2xl bg-gradient-to-r from-amber-400/15 via-white/5 to-amber-400/15 border border-amber-400/35 backdrop-blur-md shadow-lg flex items-center gap-2 hover:border-amber-400/60 transition-colors">
                  <span className="text-xl">☁️</span>
                  <span className="text-sm sm:text-base font-bold text-amber-300">کاملاً آنلاین و ابری</span>
                </div>

                <div className="animate-float-2 px-5 py-3 rounded-2xl bg-gradient-to-r from-amber-400/15 via-white/5 to-amber-400/15 border border-amber-400/35 backdrop-blur-md shadow-lg flex items-center gap-2 hover:border-amber-400/60 transition-colors">
                  <span className="text-xl">🎓</span>
                  <span className="text-sm sm:text-base font-bold text-amber-300">پشتیبانی مستقیم تا انتشار</span>
                </div>

                <div className="animate-float-3 px-5 py-3 rounded-2xl bg-gradient-to-r from-amber-400/15 via-white/5 to-amber-400/15 border border-amber-400/35 backdrop-blur-md shadow-lg flex items-center gap-2 hover:border-amber-400/60 transition-colors">
                  <span className="text-xl">🔒</span>
